<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>새 게임</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;min-height:100vh;background:#101827;color:#edf2f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,1000px)}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(28px,5vw,42px);margin:0}
.status{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid #334155;border-radius:999px;background:#1e293b;font-size:14px;color:#cbd5e1}
.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b}
.status[data-state="connected"] .dot{background:#34d399}
.status[data-state="disconnected"] .dot{background:#f87171}
.stage{min-height:420px;display:grid;place-items:center;border:1px solid #334155;border-radius:16px;background:#0b1220;position:relative;overflow:hidden}
.stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(to right,rgba(148,163,184,.12) 1px,transparent 1px),linear-gradient(to bottom,rgba(148,163,184,.12) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.message{position:relative;text-align:center;padding:24px}
.message h2{font-size:clamp(22px,3vw,30px);margin:0 0 10px}
.message p{margin:0;color:#94a3b8}
footer{margin-top:14px;color:#64748b;font-size:13px;text-align:right}
@media(max-width:600px){body{padding:14px}.stage{min-height:300px}}
</style>
</head>
<body>
<main>
<header>
<h1>새 게임</h1>
<div id="online-status" class="status" data-state="connecting" role="status" aria-live="polite"><span class="dot"></span><span id="online-label">온라인 서버 연결 중</span></div>
</header>
<section class="stage" aria-label="새 게임 제작 공간">
<div class="message">
<h2>새 게임 제작 공간</h2>
<p>기존 게임 요소가 초기화되었습니다.</p>
</div>
</section>
<footer>온라인 연결 기능 유지</footer>
</main>
<script>
(() => {
  const status = document.querySelector('#online-status');
  const label = document.querySelector('#online-label');
  let socket;
  let retryTimer;
  let stopped = false;
  function setStatus(state, text) {
    status.dataset.state = state;
    label.textContent = text;
  }
  function connect() {
    if (stopped) return;
    const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
    socket = new WebSocket(scheme + '//' + location.host);
    socket.addEventListener('open', () => setStatus('connected', '온라인 서버 연결됨'));
    socket.addEventListener('message', event => {
      try {
        const message = JSON.parse(event.data);
        if (message.type === 'connected') setStatus('connected', '온라인 서버 연결됨');
      } catch (_) {}
    });
    socket.addEventListener('close', () => {
      setStatus('disconnected', '서버 연결 끊김 · 재연결 중');
      if (!stopped) retryTimer = setTimeout(connect, 1800);
    });
    socket.addEventListener('error', () => {
      setStatus('disconnected', '온라인 연결 오류');
      try { socket.close(); } catch (_) {}
    });
  }
  window.addEventListener('beforeunload', () => {
    stopped = true;
    clearTimeout(retryTimer);
    if (socket) socket.close();
  });
  connect();
})();
</script>
</body>
</html>
