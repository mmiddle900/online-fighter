<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>ONLINE FIGHTER - 제너럴 K</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#101827;color:#edf2f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(100%,1000px)}
    header{margin-bottom:18px}
    h1{font-size:clamp(28px,5vw,42px);margin:0 0 8px}
    p{color:#aab8ca;margin:0}
    .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px}
    .grid-label{font-size:13px;color:#aab8ca}
    .toggle{border:1px solid #64748b;border-radius:8px;background:#1e293b;color:#edf2f7;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer}
    .toggle[aria-pressed="true"]{background:#1d4ed8;border-color:#60a5fa}
    .arena{position:relative;isolation:isolate;overflow:hidden;width:100%;aspect-ratio:16/9;min-height:260px;background:#0a111d;border:1px solid #334155;border-radius:14px;display:grid;place-items:center;text-align:center;padding:24px}
    .arena:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(to right,rgba(148,163,184,.22) 1px,transparent 1px),linear-gradient(to bottom,rgba(148,163,184,.22) 1px,transparent 1px);background-size:40px 40px}
    .arena.crosshair-on:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent calc(50% - .5px),rgba(248,113,113,.9) calc(50% - .5px),rgba(248,113,113,.9) calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(to bottom,transparent calc(50% - .5px),rgba(248,113,113,.9) calc(50% - .5px),rgba(248,113,113,.9) calc(50% + .5px),transparent calc(50% + .5px))}
    .arena strong{display:block;font-size:clamp(18px,3vw,26px);margin-bottom:8px}
    .arena span{color:#8fa1b8}
    .arena-content{position:relative;z-index:1;padding:10px 14px;border-radius:10px;background:rgba(10,17,29,.82)}
    #battle-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
    .arena.crosshair-on:after{z-index:2}
    .hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;color:#cbd5e1;font-size:14px}
    .key{display:inline-block;min-width:25px;padding:2px 6px;margin:0 2px;border:1px solid #64748b;border-radius:5px;background:#1e293b;text-align:center;font-weight:700;color:#fff}
    .attack-log{color:#93c5fd}
    footer{margin-top:12px;color:#718198;font-size:13px}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ONLINE FIGHTER</h1>
      <p>제너럴 K 훈련장</p>
    </header>
    <div class="toolbar">
      <span class="grid-label">격자 간격: 1칸 = 1m</span>
      <button id="crosshair-toggle" class="toggle" type="button" aria-pressed="true">십자선 표시: ON</button>
    </div>
    <section class="arena crosshair-on" aria-label="제너럴 K 훈련장">
      <canvas id="battle-canvas" aria-label="더미 캐릭터 게임 화면"></canvas>
    </section>
    <div class="hud">
      <span>캐릭터: <strong>제너럴 K</strong> · 좌표: <strong id="position-readout">x: 0, y: -4</strong></span>
      <span class="attack-log" id="action-readout">대기 중</span>
    </div>
    <div class="hud"><span>상대 체력: <strong id="enemy-hp">1000 / 1000</strong></span><span>내 공격력은 사거리 안에서 적중합니다</span></div>
    <div class="hud">
      <span>이동 <span class="key">A</span><span class="key">D</span> · 점프 <span class="key">W</span></span>
      <span>잽 <span class="key">G</span> · 훅 <span class="key">H</span> · 어퍼컷 <span class="key">J</span></span>
    </div>
    <footer>프로젝트 기반 버전 0.1.0</footer>
  </main>
  <script>
    // 더미 캐릭터 기본 조작
    const canvas = document.querySelector('#battle-canvas');
    const ctx = canvas.getContext('2d');
    // 제너럴 K 전용 128×128 논리 픽셀 캔버스. 256px 원화 좌표를 절반으로 줄여 2배 확대한다.
    const characterPixelCanvas = document.createElement('canvas');
    characterPixelCanvas.width = 128;
    characterPixelCanvas.height = 128;
    const characterPixelCtx = characterPixelCanvas.getContext('2d');
    const positionReadout = document.querySelector('#position-readout');
    const actionReadout = document.querySelector('#action-readout');
    const enemyHpReadout = document.querySelector('#enemy-hp');
    const enemy = { x: 3.2, hp: 1000, maxHp: 1000, hitUntil: 0, hitFlash: 0 };
    const attackCooldowns = { g: 0, h: 0, j: 0 };
    // Character + VFX atlas (checkerboard matte is removed at load time).
    const dummySprite = new Image();
    const spriteLocalUrl = '/%ED%94%BD%EC%85%80%20%EC%95%84%ED%8A%B8%20%EB%8B%8C%EC%9E%90%20%EC%BA%90%EB%A6%AD%ED%84%B0%C2%B7%EB%B8%94%EB%A3%A8%20VFX%20%EC%8A%A4%ED%94%84%EB%9D%BC%EC%9D%B4%ED%8A%B8%20%EC%8B%9C%ED%8A%B8.png';
    let spriteLoadFailed = false;
    let spriteReady = false;
    const atlasCanvas = document.createElement('canvas');
    const atlasCtx = atlasCanvas.getContext('2d', { willReadFrequently: true });
    dummySprite.onload = () => {
      atlasCanvas.width = dummySprite.naturalWidth;
      atlasCanvas.height = dummySprite.naturalHeight;
      atlasCtx.drawImage(dummySprite, 0, 0);
      const pixels = atlasCtx.getImageData(0, 0, atlasCanvas.width, atlasCanvas.height);
      const d = pixels.data;
      for (let i = 0; i < d.length; i += 4) {
        const hi = Math.max(d[i], d[i+1], d[i+2]);
        const lo = Math.min(d[i], d[i+1], d[i+2]);
        const lightness = (d[i] + d[i+1] + d[i+2]) / 3;
        // The source sheet uses a light gray checkerboard instead of transparency.
        if (lightness > 165 && hi - lo < 34) d[i+3] = 0;
      }
      atlasCtx.putImageData(pixels, 0, 0);
      spriteReady = true;
    };
    dummySprite.onerror = () => { spriteLoadFailed = true; };
    dummySprite.src = spriteLocalUrl;

    // 프레임마다 폭·높이·간격이 다르므로 균등 간격으로 자르지 않고
    // 원본 이미지에서 확인한 각 캐릭터의 실제 경계 상자를 사용한다.
    const characterFrames = {
      idle: { drawH: 156, frames: [[121,37,55,65],[196,25,67,77],[280,24,65,78],[365,23,65,79],[446,23,67,79],[532,23,75,79],[628,22,76,80],[724,22,79,80],[820,22,76,80],[913,22,75,80]] },
      walk: { drawH: 156, frames: [[115,111,61,68],[197,112,66,67],[280,115,71,63],[368,114,69,65],[452,114,72,65],[542,117,74,62],[634,117,77,61],[722,117,84,62],[825,114,74,65],[918,111,91,68],[1015,111,89,68],[1115,112,75,67],[1215,112,88,66],[1315,117,95,62],[1428,117,95,62]] },
      jab: { drawH: 156, frames: [[110,189,62,65],[197,189,65,65],[282,190,68,64],[376,189,93,65],[491,190,71,64],[586,190,69,64],[681,191,74,63],[779,191,80,63]] },
      hook: { drawH: 156, frames: [[92,265,86,71],[194,265,71,71],[285,265,89,71],[390,265,90,71],[496,265,92,71],[602,265,102,70],[720,265,107,70],[838,265,98,70]] },
      upper: { drawH: 156, frames: [[107,349,75,68],[205,349,74,68],[307,349,72,68],[410,348,79,69],[519,347,67,70],[613,348,80,69],[726,347,81,71],[843,342,74,75]] },
      dash: { drawH: 112, frames: [[103,428,74,53],[197,429,71,52],[294,432,80,49],[416,432,97,48],[554,432,96,49],[692,433,99,48],[841,426,104,55],[1000,426,107,55]] },
      hit: { drawH: 104, frames: [[114,489,62,52],[203,489,63,52],[301,491,71,50],[415,493,72,48],[535,513,80,28],[646,512,95,29],[783,520,103,21],[916,513,73,28],[1010,490,67,51],[1098,495,71,46]] },
      victory: { drawH: 156, frames: [[115,551,63,55],[216,555,64,51],[325,559,62,47],[444,561,60,45],[554,569,76,37],[667,555,65,51]] }
    };
    const attackVfx = {
      jab: { x: 12, y: 910, w: 195, h: 88 },
      hook: { x: 326, y: 750, w: 176, h: 150 },
      upper: { x: 330, y: 752, w: 90, h: 150 }
    };
    const attackSpecs = { g: { name: '잽', damage: 80, range: 1.45, cooldown: 420 }, h: { name: '훅', damage: 130, range: 1.9, cooldown: 720 }, j: { name: '어퍼컷', damage: 200, range: 1.65, cooldown: 1050 } };
    const dummy = { name: '제너럴 K', x: 0, y: -4, speed: 4, facing: { x: 0, y: 0 } };
    let jumpHeight = 0;
    let jumpVelocity = 0;
    const jumpPower = 620;
    const gravity = 1700;
    const pressedKeys = new Set();
    let activeAttack = null;
    let attackUntil = 0;
    let lastFrame = 0;

    function resizeBattleCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeBattleCanvas);
    resizeBattleCanvas();

    function triggerDummyAttack(type) {
      const now = performance.now();
      const spec = attackSpecs[type];
      if (now < attackCooldowns[type]) {
        actionReadout.textContent = spec.name + ' 재사용 대기 중';
        return;
      }
      activeAttack = spec.name;
      attackUntil = now + 260;
      attackCooldowns[type] = now + spec.cooldown;
      const distance = Math.abs(enemy.x - dummy.x);
      const facingEnemy = Math.sign(enemy.x - dummy.x) === (dummy.facing.x || 1);
      if (enemy.hp > 0 && distance <= spec.range && facingEnemy) {
        enemy.hp = Math.max(0, enemy.hp - spec.damage);
        enemy.hitUntil = now + 180;
        enemy.x += (dummy.facing.x || 1) * 0.18;
        actionReadout.textContent = spec.name + ' 적중! -' + spec.damage;
      } else {
        actionReadout.textContent = spec.name + ' 빗나감';
      }
      enemyHpReadout.textContent = enemy.hp + ' / ' + enemy.maxHp;
    }

    window.addEventListener('keydown', event => {
      const key = event.key.toLowerCase();
      if (['w','a','s','d','g','h','j'].includes(key)) event.preventDefault();
      if (['a','d'].includes(key)) pressedKeys.add(key);
      if (key === 'w' && !event.repeat && jumpHeight <= 0) jumpVelocity = jumpPower;
      if (!event.repeat && ['g','h','j'].includes(key)) triggerDummyAttack(key);
    });
    window.addEventListener('keyup', event => pressedKeys.delete(event.key.toLowerCase()));
    window.addEventListener('blur', () => pressedKeys.clear());

    function drawBattle(now) {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width, height = rect.height;
      const dt = lastFrame ? Math.min((now - lastFrame) / 1000, 0.05) : 0;
      lastFrame = now;
      const dx = (pressedKeys.has('d') ? 1 : 0) - (pressedKeys.has('a') ? 1 : 0);
      const dy = 0;
      if (dx) {
        dummy.x = Math.max(-7.2, Math.min(7.2, dummy.x + dx * dummy.speed * dt));
        dummy.facing = { x: dx, y: 0 };
      }
      if (jumpHeight > 0 || jumpVelocity > 0) {
        jumpVelocity -= gravity * dt;
        jumpHeight += jumpVelocity * dt;
        if (jumpHeight <= 0) { jumpHeight = 0; jumpVelocity = 0; }
      }
      const unit = 40;
      const groundScreenY = height * 0.78;
      const screenX = width / 2 + dummy.x * unit;
      const screenY = groundScreenY - jumpHeight;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#0a111d';
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = 'rgba(148,163,184,.22)';
      ctx.lineWidth = 1;
      for (let x = ((width / 2) % unit); x < width; x += unit) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = ((height / 2) % unit); y < height; y += unit) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }
      // y = -4 바닥선: 캐릭터 발이 이 선 위에 놓입니다.
      ctx.strokeStyle = 'rgba(226,232,240,.65)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, groundScreenY + 1); ctx.lineTo(width, groundScreenY + 1); ctx.stroke();
      ctx.fillStyle = 'rgba(148,163,184,.75)';
      ctx.font = '11px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText('GROUND  y = -4', 10, groundScreenY + 18);

      // 훈련 상대: 체력과 피격 반응이 있는 적 캐릭터
      const enemyScreenX = width / 2 + enemy.x * unit;
      const enemyHit = now < enemy.hitUntil;
      if (enemy.hp > 0) {
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,.35)';
        ctx.beginPath(); ctx.ellipse(enemyScreenX, groundScreenY + 3, 20, 6, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = enemyHit ? '#fca5a5' : '#7f1d1d';
        ctx.strokeStyle = enemyHit ? '#fff' : '#f87171';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(enemyScreenX - 12, groundScreenY - 58, 24, 38, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#450a0a'; ctx.fillRect(enemyScreenX - 9, groundScreenY - 53, 18, 22);
        ctx.fillStyle = '#fecaca';
        ctx.beginPath(); ctx.arc(enemyScreenX, groundScreenY - 73, 13, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#450a0a'; ctx.beginPath(); ctx.arc(enemyScreenX, groundScreenY - 76, 14, Math.PI, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fca5a5'; ctx.fillRect(enemyScreenX - 9, groundScreenY - 75, 18, 4);
        ctx.strokeStyle = '#fecaca'; ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(enemyScreenX - 10, groundScreenY - 51); ctx.lineTo(enemyScreenX - 17, groundScreenY - 29); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(enemyScreenX + 10, groundScreenY - 51); ctx.lineTo(enemyScreenX + 17, groundScreenY - 29); ctx.stroke();
        ctx.strokeStyle = '#991b1b'; ctx.lineWidth = 9;
        ctx.beginPath(); ctx.moveTo(enemyScreenX - 5, groundScreenY - 22); ctx.lineTo(enemyScreenX - 9, groundScreenY - 3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(enemyScreenX + 5, groundScreenY - 22); ctx.lineTo(enemyScreenX + 9, groundScreenY - 3); ctx.stroke();
        ctx.fillStyle = '#fee2e2'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
        ctx.fillText('훈련 상대', enemyScreenX, groundScreenY - 94);
        ctx.fillStyle = '#334155'; ctx.fillRect(enemyScreenX - 22, groundScreenY - 108, 44, 5);
        ctx.fillStyle = '#ef4444'; ctx.fillRect(enemyScreenX - 22, groundScreenY - 108, 44 * enemy.hp / enemy.maxHp, 5);
        ctx.restore();
      } else {
        ctx.fillStyle = '#86efac'; ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'center';
        ctx.fillText('훈련 완료!', enemyScreenX, groundScreenY - 24);
      }

      // 제너럴 K: 관절과 무게중심을 정리한 오른쪽 측면 픽셀 인체
      const attackActive=!!activeAttack&&now<attackUntil;
      const attackProgress=attackActive?1-(attackUntil-now)/260:0;
      const motion=attackActive?(activeAttack==='잽'?'jab':activeAttack==='훅'?'hook':'upper'):jumpHeight>0?'jump':dx?'walk':'idle';
      const stride=motion==='walk'?Math.sin(now/110)*3:0;
      const punch=attackActive?Math.sin(Math.min(1,attackProgress)*Math.PI):0;
      const pc=characterPixelCtx;pc.clearRect(0,0,128,128);pc.save();pc.imageSmoothingEnabled=false;pc.scale(0.5,0.5);
      // 2px 단위 픽셀 군집으로 윤곽·관절·갑옷 명암을 세밀하게 정리
      const snap=v=>Math.round(v/2)*2;
      const px=(x,y,w,h,col)=>{pc.fillStyle=col;pc.fillRect(snap(x),snap(y),Math.max(2,Math.round(w/2)*2),Math.max(2,Math.round(h/2)*2));};
      const poly=(pts,col)=>{pc.fillStyle=col;pc.beginPath();pc.moveTo(snap(pts[0][0]),snap(pts[0][1]));for(let i=1;i<pts.length;i++)pc.lineTo(snap(pts[i][0]),snap(pts[i][1]));pc.closePath();pc.fill();};
      const line=(pts,col,w)=>{pc.strokeStyle=col;pc.lineWidth=Math.max(2,Math.round(w/2)*2);pc.lineCap='square';pc.lineJoin='miter';pc.beginPath();pc.moveTo(snap(pts[0][0]),snap(pts[0][1]));for(let i=1;i<pts.length;i++)pc.lineTo(snap(pts[i][0]),snap(pts[i][1]));pc.stroke();};
      const C={ink:'#080d15',shadow:'#172333',dark:'#26384c',mid:'#405970',lit:'#647f96',shine:'#a9bac8',steel:'#d0d9df',cloth:'#202638',cloth2:'#35384d',gold:'#a9824c',gold2:'#d8bd83',cyan:'#42e5dc',white:'#d9fffc'};
      // 망토와 칼집은 진행 방향의 반대쪽에 배치
      poly([[119,66],[103,61],[88,70],[79,91],[78,122],[67,158],[54,190],[43,225],[58,215],[76,188],[91,157],[105,126],[120,96]],C.ink);
      poly([[115,70],[103,67],[92,76],[84,96],[84,122],[73,158],[58,204],[72,188],[88,158],[102,128],[116,98]],C.cloth);
      poly([[91,85],[86,121],[91,151],[99,162],[105,130],[108,101]],C.cloth2);
      line([[84,119],[80,155],[63,197]],'#77748a',2);
      poly([[112,73],[84,37],[91,31],[126,69]],C.ink);poly([[116,70],[91,39],[96,36],[130,69]],C.mid);
      poly([[124,74],[143,34],[150,36],[135,81]],C.ink);poly([[129,72],[145,40],[148,41],[137,76]],C.lit);
      px(84,32,10,5,C.gold);px(143,31,10,5,C.gold);
      // 뒤쪽 다리: 엉덩이-무릎-발목의 꺾임을 분명히 하고 뒤로 체중を 받침
      pc.save();pc.translate(-stride,0);
      poly([[103,137],[128,137],[139,154],[132,176],[116,194],[106,215],[105,232],[120,239],[128,245],[123,251],[75,251],[70,246],[85,236],[88,218],[89,197],[88,177],[91,157]],C.ink);
      poly([[107,143],[126,143],[133,157],[127,175],[112,193],[101,215],[100,231],[114,238],[119,244],[82,245],[92,234],[94,216],[95,197],[94,177],[96,159]],C.dark);
      poly([[109,149],[126,153],[123,172],[109,191],[99,214],[97,229],[94,211],[101,188],[101,170]],C.mid);
      poly([[88,235],[119,238],[132,246],[128,250],[75,250],[73,246]],C.ink);
      poly([[91,240],[118,242],[125,246],[116,247],[82,247]],C.lit);
      px(103,238,10,3,C.steel);pc.restore();
      // 앞쪽 다리: 골반 아래에서 앞으로 굽힌 무릎, 정면을 향하는 발
      pc.save();pc.translate(stride,0);
      poly([[119,137],[143,137],[153,154],[151,175],[163,195],[174,217],[187,236],[211,241],[216,248],[211,252],[161,252],[151,246],[150,230],[141,211],[130,191],[119,173],[109,155]],C.ink);
      poly([[124,143],[141,143],[147,157],[145,174],[157,194],[168,216],[181,235],[204,242],[207,247],[164,247],[157,241],[156,228],[146,209],[135,190],[125,173],[116,157]],C.dark);
      poly([[132,149],[144,157],[141,173],[153,194],[164,215],[176,235],[165,231],[151,210],[139,190],[128,172]],C.mid);
      poly([[178,235],[205,241],[214,247],[211,251],[161,250],[155,246],[161,240]],C.ink);
      poly([[179,240],[202,244],[207,247],[197,248],[164,247]],C.lit);
      px(185,240,10,3,C.steel);px(202,244,6,2,C.gold);pc.restore();
      // 골반과 허리: 흉곽과 분리된 골반 덩어리, 허리선은 안쪽으로 들어감
      poly([[99,119],[132,116],[151,130],[151,149],[137,164],[108,160],[91,145]],C.ink);
      poly([[104,125],[130,122],[144,133],[144,147],[134,157],[111,154],[98,142]],C.dark);
      poly([[108,128],[127,126],[137,137],[128,151],[111,147]],C.mid);
      poly([[96,143],[145,140],[153,148],[145,155],[104,155],[92,149]],'#51483f');
      px(124,141,17,9,C.gold);px(128,143,10,4,C.gold2);px(132,145,4,2,C.ink);
      // 흉곽: 등쪽은 왼쪽, 가슴 앞면은 오른쪽. 어깨에서 허리로 자연스럽게 좁아짐
      poly([[105,55],[126,48],[146,55],[160,70],[165,91],[158,112],[145,132],[127,143],[106,136],[91,119],[86,94],[91,71]],C.ink);
      poly([[109,60],[126,54],[142,60],[154,73],[159,91],[152,110],[140,127],[126,136],[109,130],[97,116],[92,94],[97,74]],C.dark);
      poly([[101,66],[115,61],[126,68],[124,91],[116,113],[103,122],[96,108],[97,84]],C.mid);

      let armX=0,armY=0;
      if(motion==='jab'){armX=Math.round(37*punch);armY=-Math.round(3*punch);}

      poly([[176+armX,124+armY],[190+armX,119+armY],[202+armX,125+armY],[207+armX,135+armY],[200+armX,145+armY],[186+armX,146+armY],[174+armX,136+armY]],C.ink);
      poly([[180+armX,127+armY],[191+armX,124+armY],[199+armX,129+armY],[201+armX,136+armY],[195+armX,141+armY],[185+armX,140+armY],[179+armX,134+armY]],'#647e94');
      px(184+armX,128+armY,8,3,C.steel);px(194+armX,132+armY,7,3,C.shine);px(185+armX,139+armY,9,2,C.dark);
      // 목과 헬멧: 머리 크기를 줄이고 목-어깨 연결을 확보, 코와 턱은 오른쪽 실루엣
      poly([[119,42],[141,40],[151,57],[145,70],[124,67],[114,54]],C.ink);
      poly([[123,46],[139,45],[145,57],[139,63],[126,61],[119,52]],C.dark);
      poly([[108,24],[115,13],[129,7],[144,9],[156,17],[163,28],[161,36],[171,41],[164,47],[158,55],[144,58],[127,53],[114,44],[105,34]],C.ink);
      poly([[113,24],[120,16],[131,11],[144,13],[153,20],[158,29],[156,35],[165,41],[159,45],[154,51],[143,53],[129,49],[118,41],[111,33]],'#40546a');

      // 바이저와 얼굴 전면은 오른쪽으로 돌출. 눈 위치와 코끝이 같은 방향을 향함
      poly([[123,31],[154,30],[170,37],[164,44],[157,46],[131,44],[120,38]],C.ink);

      line([[137,51],[151,53],[159,49]],C.ink,3);
      // 갑옷 관절부의 분리선과 하이라이트: 작은 장식보다 큰 형태를 우선
      line([[97,151],[94,168],[101,182]],'#8fa3b4',3);

      poly([[141,187],[153,186],[158,194],[151,201],[141,199]],C.mid);

      pc.restore();ctx.save();ctx.imageSmoothingEnabled=false;
      const spriteTop=groundScreenY-jumpHeight-256;
      ctx.drawImage(characterPixelCanvas,Math.round(screenX-128),Math.round(spriteTop),256,256);
      ctx.restore();
      // purely visual blue attack trail; hitbox and damage remain unchanged
      if(attackActive){ctx.save();ctx.globalAlpha=.8*Math.sin(Math.min(1,attackProgress)*Math.PI);ctx.translate(screenX+42,groundScreenY-jumpHeight-60);ctx.strokeStyle='#55caff';ctx.shadowColor='#168bff';ctx.shadowBlur=10;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();if(motion==='jab'){ctx.moveTo(-4,0);ctx.quadraticCurveTo(20,-10,43,-2);}else if(motion==='hook'){ctx.arc(0,0,25,-1.15,.6);}else{ctx.moveTo(-4,13);ctx.quadraticCurveTo(22,-9,19,-34);}ctx.stroke();ctx.restore();}
      ctx.fillStyle = '#bfdbfe';
      ctx.font = '12px system-ui';

      ctx.fillText('제너럴 K', screenX, groundScreenY - 270 - jumpHeight);
      if (!attackActive && activeAttack) {
        activeAttack = null;
        actionReadout.textContent = '대기 중';
      }
      ctx.restore();
      positionReadout.textContent = 'x: ' + dummy.x.toFixed(1) + ', y: ' + dummy.y.toFixed(1);
      requestAnimationFrame(drawBattle);
    }
    requestAnimationFrame(drawBattle);

    // 월드 좌표 규칙: y = -4가 캐릭터가 서는 바닥 높이입니다.
    const FightWorld = Object.freeze({
      groundY: -4,
      characterStandingY: -4,
      gridUnit: 1
    });
    window.FightWorld = FightWorld;

    // 십자선 표시 설정
    const arena = document.querySelector('.arena');
    const crosshairToggle = document.querySelector('#crosshair-toggle');
    crosshairToggle.addEventListener('click', () => {
      const enabled = crosshairToggle.getAttribute('aria-pressed') !== 'true';
      crosshairToggle.setAttribute('aria-pressed', String(enabled));
      crosshairToggle.textContent = '십자선 표시: ' + (enabled ? 'ON' : 'OFF');
      arena.classList.toggle('crosshair-on', enabled);
    });

    // 기본 전투 규칙: 모든 시간 단위는 밀리초(ms)입니다.
    const FightRules = Object.freeze({
      stun: Object.freeze({
        weak: Object.freeze({ duration: 100, blocksInput: true, blocksAttack: false }),
        strong: Object.freeze({ duration: 300, blocksInput: true, blocksAttack: true })
      })
    });

    function createCombatState() {
      return { inputLockedUntil: 0, attackLockedUntil: 0, stunType: null };
    }

    function applyStun(state, type, now = performance.now()) {
      const rule = FightRules.stun[type];
      if (!state || !rule) throw new Error('올바르지 않은 기절 상태입니다.');
      if (rule.blocksInput) state.inputLockedUntil = Math.max(state.inputLockedUntil || 0, now + rule.duration);
      if (rule.blocksAttack) state.attackLockedUntil = Math.max(state.attackLockedUntil || 0, now + rule.duration);
      state.stunType = type;
      return rule.duration;
    }

    function canReceiveKeyInput(state, now = performance.now()) {
      return !state || now >= (state.inputLockedUntil || 0);
    }

    function canStartAttack(state, now = performance.now()) {
      return !state || now >= (state.attackLockedUntil || 0);
    }

    function getActiveStun(state, now = performance.now()) {
      if (!state) return null;
      if (now < (state.attackLockedUntil || 0)) return 'strong';
      if (now < (state.inputLockedUntil || 0)) return 'weak';
      state.stunType = null;
      return null;
    }

    // 이후 이동·공격 입력 시스템은 반드시 위 판정 함수를 거치도록 연결합니다.
    window.FightRules = Object.freeze({
      stun: FightRules.stun,
      createCombatState,
      applyStun,
      canReceiveKeyInput,
      canStartAttack,
      getActiveStun
    });
  </script>
