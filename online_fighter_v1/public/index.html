<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEW GAME — 멀티플레이 로비</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#203657 0,#101827 58%,#090f19 100%);color:#f4f7ff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(760px,100%)}header{text-align:center;margin-bottom:28px}h1{font-size:clamp(30px,6vw,48px);letter-spacing:2px;margin:0 0 9px}.sub{color:#aebed3}.panel{background:#17263b;border:1px solid #38506d;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 16px 44px #0005}.panel h2{font-size:18px;margin:0 0 14px}.row{display:flex;gap:10px;flex-wrap:wrap}button,input,select{font:inherit;border-radius:9px;padding:12px;border:1px solid #607895}button{background:#3975b9;color:white;font-weight:700;cursor:pointer}button.secondary{background:#263b55}button:disabled{opacity:.5;cursor:not-allowed}input,select{background:#0e1928;color:#fff;min-width:0}input{flex:1;text-transform:uppercase;letter-spacing:3px;font-weight:700}.status{padding:13px;border-radius:10px;background:#0e1928;color:#bcd0e8;min-height:48px;line-height:1.5}.status.good{color:#9ef0c0}.status.bad{color:#ffaaaa}.roomcode{font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:8px;text-align:center;padding:12px;color:#fff}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.slot{background:#0e1928;border:1px solid #334a66;border-radius:10px;padding:15px 8px;text-align:center;color:#8ea4bd}.slot.active{border-color:#66c99a;color:#a9f2c7}.hidden{display:none}.hint{font-size:12px;color:#8fa4bd;line-height:1.6;margin-top:12px}@media(max-width:480px){.panel{padding:15px}.row>*{width:100%}.players{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<header><h1>NEW GAME</h1><div class="sub">새로운 게임 프로젝트 · 멀티플레이 로비</div></header>
<section class="panel" id="connectPanel"><h2>온라인 대전</h2><div class="row"><select id="capacity" aria-label="인원 선택"><option value="2">2인 대전</option><option value="3">3인 개인전</option></select><button id="createBtn">방 만들기</button></div><div class="hint">방을 만든 뒤 표시되는 6자리 코드를 친구에게 공유하세요.</div></section>
<section class="panel" id="joinPanel"><h2>방 참가</h2><div class="row"><input id="roomInput" maxlength="6" placeholder="방 코드 6자리" autocomplete="off"><button id="joinBtn" class="secondary">참가하기</button></div></section>
<section class="panel hidden" id="roomPanel"><h2 id="roomTitle">대기실</h2><div class="roomcode" id="roomCode">------</div><div class="status" id="roomStatus">상대 플레이어를 기다리는 중입니다.</div><div class="players" id="players"></div><div class="row" style="margin-top:15px"><button id="copyBtn" class="secondary">방 코드 복사</button><button id="leaveBtn" class="secondary">방 나가기</button></div><div class="hint">현재는 멀티플레이 연결과 대기실만 남겨둔 초기 상태입니다. 게임 플레이 기능은 새로 설계합니다.</div></section>
<div class="status" id="globalStatus" role="status">서버에 연결하는 중...</div></main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let socket=null,connected=false,inRoom=false,roomCode='',role='',maxPlayers=2,playerCount=0;
function setStatus(message,kind=''){const el=$('globalStatus');el.textContent=message;el.className='status '+kind}
function setRoomStatus(message,kind=''){const el=$('roomStatus');el.textContent=message;el.className='status '+kind}
function showRoom(){$('connectPanel').classList.toggle('hidden',inRoom);$('joinPanel').classList.toggle('hidden',inRoom);$('roomPanel').classList.toggle('hidden',!inRoom)}
function drawPlayers(){const root=$('players');root.replaceChildren();for(let i=1;i<=maxPlayers;i++){const slot=document.createElement('div');slot.className='slot'+(i<=playerCount?' active':'');slot.textContent=i<=playerCount?'플레이어 '+i+' · 참가 중':'플레이어 '+i+' · 대기 중';root.appendChild(slot)}}
function send(data){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify(data));else setStatus('서버 연결이 끊어졌습니다. 페이지를 새로고침해 주세요.','bad')}
function handleMessage(msg){
 if(msg.type==='created'||msg.type==='joined'){inRoom=true;roomCode=msg.code;role=msg.role;maxPlayers=msg.maxPlayers||2;playerCount=msg.count||1;$('roomCode').textContent=roomCode;$('roomTitle').textContent=role==='host'?'방장 대기실':'참가자 대기실';drawPlayers();setRoomStatus(playerCount>=maxPlayers?'모든 플레이어가 참가했습니다.':'상대 플레이어를 기다리는 중입니다.','good');showRoom();setStatus('온라인 방에 연결되었습니다.','good')}
 else if(msg.type==='peer-joined'){playerCount=msg.count||Math.min(maxPlayers,playerCount+1);drawPlayers();setRoomStatus(playerCount>=maxPlayers?'모든 플레이어가 참가했습니다. 새 게임을 준비할 수 있습니다.':'새 플레이어가 참가했습니다.','good')}
 else if(msg.type==='peer-left'){inRoom=false;roomCode='';playerCount=0;showRoom();setStatus(msg.message||'상대방 연결이 종료되었습니다.','bad')}
 else if(msg.type==='error')setStatus(msg.message||'요청을 처리하지 못했습니다.','bad');
}
function connect(){const scheme=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(scheme+'//'+location.host);socket.addEventListener('open',()=>{connected=true;setStatus('서버에 연결되었습니다. 방을 만들거나 참가하세요.','good')});socket.addEventListener('message',event=>{try{handleMessage(JSON.parse(event.data))}catch{setStatus('서버 응답을 해석하지 못했습니다.','bad')}});socket.addEventListener('close',()=>{connected=false;inRoom=false;showRoom();setStatus('서버 연결이 종료되었습니다. 페이지를 새로고침해 다시 연결하세요.','bad')});socket.addEventListener('error',()=>setStatus('서버에 연결할 수 없습니다. 서버 상태를 확인하세요.','bad'))}
$('createBtn').addEventListener('click',()=>{if(!connected)return setStatus('서버 연결을 기다려 주세요.','bad');send({type:'create',maxPlayers:Number($('capacity').value)})});
$('joinBtn').addEventListener('click',()=>{if(!connected)return setStatus('서버 연결을 기다려 주세요.','bad');const code=$('roomInput').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))return setStatus('방 코드는 영문과 숫자 6자리로 입력하세요.','bad');send({type:'join',code})});
$('roomInput').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)});
$('copyBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(roomCode);setRoomStatus('방 코드가 복사되었습니다.','good')}catch{setRoomStatus('복사할 수 없습니다. 방 코드를 직접 복사하세요.','bad')}});
$('leaveBtn').addEventListener('click',()=>{if(socket)socket.close();inRoom=false;showRoom();setStatus('방에서 나왔습니다. 다시 참가하려면 페이지를 새로고침하세요.')});
showRoom();connect();
})();
</script></body></html>
