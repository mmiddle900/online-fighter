<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>김진수의 던전 로그라이크</title>
<style>
*{box-sizing:border-box} :root{color-scheme:dark} body{margin:0;background:#0b1020;color:#f1f5f9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}button{border:1px solid #475569;background:#263449;color:#f8fafc;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:#7c3aed;border-color:#8b5cf6}button.ready{background:#047857;border-color:#10b981}.hidden{display:none!important}.wrap{width:min(100%,1000px);margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}h1{margin:0;font-size:clamp(24px,4vw,36px)}.panel{background:#151e30;border:1px solid #2b3850;border-radius:18px;padding:20px}.sub{color:#94a3b8}.stack{display:grid;gap:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.modegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.big{padding:24px;min-height:110px;font-size:20px}.slotgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.slot{background:#0e1626;border:1px solid #334155;border-radius:14px;padding:14px;text-align:center;min-height:100px}.slot .icon{font-size:30px}.slot .small{font-size:12px;color:#94a3b8}.code{font-size:28px;letter-spacing:5px;font-weight:800}.canvasbox{position:relative;background:#080d16;border:1px solid #334155;border-radius:16px;overflow:hidden}canvas{display:block;width:100%;height:min(68vh,620px);touch-action:none}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.pill{background:#1e293b;border:1px solid #334155;border-radius:999px;padding:7px 12px;font-size:14px}.bar{height:9px;background:#334155;border-radius:99px;overflow:hidden;width:150px}.bar>i{display:block;height:100%;background:#ef4444;width:100%}.xpbar>i{background:#a78bfa}.gamecontrols{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-top:12px}.mobilepad{display:flex;align-items:center;gap:10px}.stick{width:116px;height:116px;border-radius:50%;background:#243249;border:1px solid #475569;position:relative;touch-action:none}.knob{width:44px;height:44px;border-radius:50%;background:#94a3b8;position:absolute;left:36px;top:36px}.actionbuttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.actionbuttons button{min-width:62px;min-height:58px}.log{font-size:13px;color:#cbd5e1;min-height:20px;margin-top:8px}@media(max-width:620px){.wrap{padding:12px}.panel{padding:14px}.modegrid{grid-template-columns:1fr}.slotgrid{gap:6px}.slot{padding:9px;min-height:90px}.gamecontrols{align-items:center}.actionbuttons{max-width:190px}.actionbuttons button{min-width:54px;padding:8px}.code{font-size:23px}}

/* Mobile-first combat controls */
@media(max-width:620px){
 body{min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
 .wrap{padding:10px 10px calc(12px + env(safe-area-inset-bottom))}
 .top{margin-bottom:10px;gap:8px}.top h1{font-size:21px}.top .pill{font-size:12px;padding:6px 9px}
 #game .hud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:6px}
 #game .hud .pill{border-radius:10px;padding:7px 9px;font-size:12px;min-width:0}
 #game .bar{width:100%;max-width:130px;height:6px;margin-top:3px}
 #game .hud:nth-of-type(2){display:flex;justify-content:space-between}
 .canvasbox{border-radius:12px}
 #world{width:100%;height:clamp(230px,43svh,390px);touch-action:none}
 .gamecontrols{display:grid;grid-template-columns:minmax(108px,34%) minmax(0,1fr);align-items:center;gap:10px;margin-top:10px}
 .mobilepad{flex-direction:column;gap:5px;justify-content:center}
 .mobilepad .sub{font-size:11px}
 .stick{width:clamp(104px,30vw,132px);height:clamp(104px,30vw,132px);background:radial-gradient(circle,#2d405c 0%,#1c2a40 72%);border:2px solid #526782;box-shadow:inset 0 0 0 8px #182438;}
 .knob{width:44px;height:44px;left:calc(50% - 22px);top:calc(50% - 22px);background:#cbd5e1;border:2px solid #64748b;box-shadow:0 2px 8px #0008}
 .actionbuttons{max-width:none;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;justify-content:stretch}
 .actionbuttons button{min-width:0;width:100%;min-height:58px;padding:8px 5px;border-radius:13px;font-size:13px;line-height:1.15;white-space:normal;touch-action:manipulation}
 #attack{grid-column:1/-1;min-height:54px;background:#9f1239;border-color:#fb7185;font-size:15px}
 #skill1{background:#1d4ed8;border-color:#60a5fa}#skill2{background:#6d28d9;border-color:#c4b5fd}#skill3{background:#92400e;border-color:#fbbf24}
 .log{font-size:12px;line-height:1.35;min-height:34px;margin-top:7px}
 #shop .row{display:grid;grid-template-columns:1fr;gap:8px}#shop button{min-height:48px}
 #exit-game{min-height:44px}
 button,input{touch-action:manipulation}
}
@media(max-width:360px){.gamecontrols{grid-template-columns:102px minmax(0,1fr);gap:7px}.stick{width:98px;height:98px}.actionbuttons button{font-size:12px;min-height:54px}}

/* Landscape-only mobile game */
.rotate-notice{display:none}
@media(orientation:portrait) and (max-width:900px){body{overflow:hidden}.rotate-notice{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#080d16;padding:24px;text-align:center}.rotate-card{max-width:320px;border:1px solid #334155;background:#151e30;border-radius:22px;padding:28px 22px;box-shadow:0 20px 60px #0008}.rotate-icon{font-size:54px;margin-bottom:12px}.rotate-card h2{margin:0 0 12px;font-size:23px}.rotate-card p{color:#cbd5e1;line-height:1.65;margin:0}.wrap{display:none!important}}
@media(orientation:landscape) and (max-width:900px){
 body{overflow:hidden;min-height:100dvh}.wrap{width:100%;max-width:none;height:100dvh;padding:6px 9px calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px}
 .top{display:none}#game{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
 #game .hud{display:flex;flex-wrap:nowrap;align-items:center;gap:5px;margin:0;min-height:25px;overflow:hidden}
 #game .hud .pill{font-size:11px;line-height:1.1;padding:4px 7px;border-radius:8px;white-space:nowrap;min-width:0}
 #game .bar{width:clamp(45px,10vw,95px);height:5px;margin-top:3px}
 #game .hud:nth-of-type(2) .pill{overflow:hidden;text-overflow:ellipsis}
 .canvasbox{flex:1;min-height:0;border-radius:10px;display:flex}
 #world{width:100%;height:100%;max-height:none;touch-action:none}
 .gamecontrols{display:grid;grid-template-columns:minmax(118px,22%) minmax(0,1fr);gap:8px;align-items:stretch;margin:0;flex:0 0 clamp(94px,23dvh,150px)}
 .mobilepad{justify-content:center;align-items:center;gap:4px;min-width:0}.mobilepad .sub{display:none}
 .stick{width:min(22vw,140px);height:min(22vw,140px);max-width:100%;max-height:100%;background:radial-gradient(circle,#30435f,#172438 75%);border:2px solid #5b718d;box-shadow:inset 0 0 0 7px #182438}
 .knob{width:clamp(38px,8vh,52px);height:clamp(38px,8vh,52px);left:calc(50% - clamp(19px,4vh,26px));top:calc(50% - clamp(19px,4vh,26px));background:#dbeafe;border:2px solid #64748b}
 .actionbuttons{width:100%;max-width:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:6px;justify-content:stretch}
 .actionbuttons button{min-width:0;width:100%;min-height:0;height:100%;padding:5px 3px;border-radius:12px;font-size:clamp(11px,2.2vw,15px);line-height:1.05;white-space:normal;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
 #attack{grid-column:auto;grid-row:1/-1;background:#9f1239;border-color:#fb7185;font-size:clamp(13px,2.7vw,17px)}
 #dodge-button{background:#0f766e;border-color:#5eead4;font-size:clamp(12px,2.5vw,16px)}
 #skill1{background:#1d4ed8;border-color:#60a5fa}#skill2{background:#6d28d9;border-color:#c4b5fd}#skill3{background:#92400e;border-color:#fbbf24}
 .log{display:none}#shop{max-height:35dvh;overflow:auto;padding:9px;margin:0!important}#shop h2{font-size:16px;margin:0}#shop .sub{font-size:11px;margin:3px 0}#shop .row{display:flex;gap:5px}#shop button{min-height:38px;padding:6px;font-size:11px;flex:1}
 #exit-game{display:none}
}
/* Restore page scrolling in landscape; keep controls reachable on short screens */
@media(orientation:landscape) and (max-width:900px){
 body{overflow-x:hidden!important;overflow-y:auto!important;min-height:100dvh;height:auto}
 .wrap{height:auto!important;min-height:100dvh;display:flex;flex-direction:column}
 #game{flex:0 0 auto!important;min-height:0;height:auto}
 .canvasbox{flex:0 0 auto!important;height:44dvh;min-height:190px}
 #world{height:100%!important}
 .gamecontrols{flex:0 0 auto!important;min-height:100px;margin-bottom:8px}
 #shop{max-height:none;overflow:visible}
}
@media(orientation:landscape) and (max-width:560px){.gamecontrols{grid-template-columns:112px minmax(0,1fr);flex-basis:clamp(90px,25dvh,132px);gap:6px}.stick{width:min(27vw,122px);height:min(27vw,122px)}.actionbuttons{gap:4px}.actionbuttons button{font-size:11px;border-radius:9px}}
/* Scrollable landscape layout: don't trap the page in a fixed viewport */
@media(orientation:landscape) and (max-width:900px){
 body{overflow-x:hidden!important;overflow-y:auto!important;height:auto!important;min-height:100dvh}
 .wrap{height:auto!important;min-height:100dvh!important;overflow:visible!important;padding:6px 7px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px}
 #game{flex:0 0 auto!important;height:auto!important;min-height:0!important;overflow:visible!important;display:flex;flex-direction:column;gap:6px}
 #game .hud{flex:0 0 auto!important;min-height:22px;overflow:visible}
 .canvasbox{flex:0 0 auto!important;height:clamp(180px,42dvh,360px)!important;min-height:180px!important;max-height:none!important}
 #world{height:100%!important;width:100%;touch-action:none}
 .gamecontrols{flex:0 0 auto!important;min-height:94px!important;margin:0 0 8px!important;grid-template-columns:78px minmax(0,1fr);gap:5px;align-items:center}
 .mobilepad{height:auto;min-height:0}
 .stick{width:72px;height:72px;min-width:72px;min-height:72px}
 .knob{width:34px;height:34px;left:calc(50% - 17px);top:calc(50% - 17px)}
 .actionbuttons{grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(48px,auto))!important;gap:4px}
 .actionbuttons button{min-height:48px!important;height:auto!important;padding:5px 2px;font-size:clamp(10px,1.8vw,13px);line-height:1.05}
 #attack{grid-column:1;grid-row:1/-1;font-size:clamp(11px,2vw,14px)}
 #dodge-button{font-size:clamp(10px,1.8vw,13px)}
 #exit-game{display:flex!important;min-height:42px;margin:6px 0 12px}
 #shop{max-height:none!important;overflow:visible!important;margin-bottom:12px}
}
@media(orientation:landscape) and (max-width:560px){
 .gamecontrols{grid-template-columns:74px minmax(0,1fr)!important;min-height:90px!important;gap:6px}
 .stick{width:68px;height:68px;min-width:68px;min-height:68px}
 .actionbuttons{gap:4px}
 .actionbuttons button{font-size:10px;padding:4px 1px}
}
