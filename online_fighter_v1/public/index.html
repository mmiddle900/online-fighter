<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>새 격투 게임</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#101827;color:#edf2f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(100%,1000px)}
    header{margin-bottom:18px}
    h1{font-size:clamp(28px,5vw,42px);margin:0 0 8px}
    p{color:#aab8ca;margin:0}
    .arena{width:100%;aspect-ratio:16/9;min-height:260px;background:#0a111d;border:1px solid #334155;border-radius:14px;display:grid;place-items:center;text-align:center;padding:24px}
    .arena strong{display:block;font-size:clamp(18px,3vw,26px);margin-bottom:8px}
    .arena span{color:#8fa1b8}
    footer{margin-top:12px;color:#718198;font-size:13px}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>새 격투 게임</h1>
      <p>새로운 전투 시스템을 만들기 위한 초기 프로젝트</p>
    </header>
    <section class="arena" aria-label="게임 화면">
      <div>
        <strong>전투 시스템 초기화 완료</strong>
        <span>이곳에서 새로운 격투 게임을 시작합니다.</span>
      </div>
    </section>
    <footer>프로젝트 기반 버전 0.1.0</footer>
  </main>
  <script>
    // 새 게임 로직은 이곳에서 시작합니다.
    // 이전 게임의 캐릭터, 기술, 전투 규칙 및 UI 코드는 포함하지 않습니다.
  </script>
</body>
</html>
